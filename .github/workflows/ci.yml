name: CI

# Pushes to main are checked by the deploy workflow, which runs the same gate
# before publishing. This one covers everything on its way in.
on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Install dependencies
        run: npm ci

      - name: Check types and content
        run: npm run check

      - name: Run unit tests
        run: npm run test

      - name: Build site and search index
        run: npm run build

      - name: Lint trace quality
        run: npm run lint:traces
