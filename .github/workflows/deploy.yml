# Build the static site and publish it to GitHub Pages.
#
# Pages is configured with Settings → Pages → Source: "GitHub Actions", so this
# workflow is the deployment — there is no gh-pages branch to keep in sync.
# The site lands at https://<owner>.github.io/<repo>/, which is why
# astro.config.mjs sets `base` to the repo name.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs to mint an OIDC token for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. In-progress runs finish rather than being cancelled,
# so a half-uploaded artifact never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same gate as CI. A push straight to main is not published unless
      # the types, the content schemas, the cross-file ids and the traces
      # all still hold.
      - name: Check types and content
        run: npm run check

      - name: Run unit tests
        run: npm run test

      - name: Lint trace quality
        run: npm run lint:traces

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # The base path and origin come from Pages itself rather than being
      # typed here, so a repo rename moves the site without an edit.
      # astro.config.mjs falls back to the current name for local builds.
      - name: Build site and search index
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
